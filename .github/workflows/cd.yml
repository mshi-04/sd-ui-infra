name: cd

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

jobs:
  dev:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: dev

  prod:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prod
