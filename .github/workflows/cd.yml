name: cd

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  dev:
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: dev

  prod:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prod
