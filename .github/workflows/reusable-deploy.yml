name: reusable-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: デプロイ先の GitHub Environment 名
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_public_client_redirect_uris: ${{ vars.PUBLIC_CLIENT_REDIRECT_URIS }}
      TF_VAR_allowed_origins: ${{ vars.ALLOWED_ORIGINS }}
      TF_VAR_app_role_assignments: ${{ vars.APP_ROLE_ASSIGNMENTS }}
      TF_VAR_pre_authorized_client_ids: ${{ vars.PRE_AUTHORIZED_CLIENT_IDS }}
      TF_VAR_alert_email_addresses: ${{ vars.ALERT_EMAIL_ADDRESSES || '[]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read Terraform version
        id: terraform_version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}
          terraform_wrapper: false
      - name: Apply
        id: terraform
        run: |
          terraform -chdir=envs/${{ inputs.environment }} init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}"
          terraform -chdir=envs/${{ inputs.environment }} apply -auto-approve -input=false
          echo "function_app_name=$(terraform -chdir=envs/${{ inputs.environment }} output -raw function_app_name)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ steps.terraform.outputs.function_app_name }}
          package: functions/sdui_api
          remote-build: true
