name: reusable-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: デプロイ先の GitHub Environment 名
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_spa_redirect_uris: ${{ vars.SPA_REDIRECT_URIS }}
      TF_VAR_allowed_origins: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v5
      - name: Read Terraform version
        id: terraform_version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}
          terraform_wrapper: false
      - name: Apply
        id: terraform
        run: |
          terraform -chdir=envs/${{ inputs.environment }} init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}"
          terraform -chdir=envs/${{ inputs.environment }} apply -auto-approve -input=false
          echo "function_app_name=$(terraform -chdir=envs/${{ inputs.environment }} output -raw function_app_name)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.terraform.outputs.function_app_name }}
          package: functions/sdui_api
          remote-build: true
